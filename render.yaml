# Render Blueprint — all three pieces of the app.
#
#   ai-interview-web   static Vite build
#   ai-interview-api   Fastify API, Prisma against Neon, Supabase for recordings
#
# The Python AI service is NOT here. Whisper, MediaPipe and Piper together need
# more memory than Render's free tier allows, and paying for that is avoidable:
# a Hugging Face Space runs the same container free with far more headroom. The
# root Dockerfile builds it. Point AI_SERVICE_URL at the Space.
#
# After the first deploy, set VITE_API_URL on the web service to the API's URL and
# redeploy it — a static site bakes its env vars in at build time, and Render cannot
# compose a full URL from another service inside this file.

services:
  # ---------------------------------------------------------------------------
  # 1. Frontend
  # ---------------------------------------------------------------------------
  - type: web
    name: ai-interview-web
    runtime: static
    # corepack is not guaranteed on the build image, so fall back to a global
    # install. .nvmrc pins Node 20; Vite 6 needs 18 or newer.
    buildCommand: >-
      (corepack enable pnpm || npm install -g pnpm@9.14.2) &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @interview/web build
    staticPublishPath: apps/web/dist
    envVars:
      # Full https URL of ai-interview-api, e.g. https://ai-interview-api.onrender.com
      # Baked into the bundle at build time, so changing it needs a redeploy.
      - key: VITE_API_URL
        sync: false
    routes:
      # Single-page app: every unknown path serves the shell and React routes it.
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------------------------------------------------------------------------
  # 2. Node API
  # ---------------------------------------------------------------------------
  - type: web
    name: ai-interview-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Neon connection string, including ?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Exact origin of the web service; the CORS allowlist checks against it.
      - key: FRONTEND_URL
        sync: false
      # Private Supabase bucket named "interview" holds resumes and recordings.
      # Omit both and the API falls back to local disk, which Render wipes on restart.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Full https URL of the Hugging Face Space running the AI service,
      # e.g. https://<user>-<space>.hf.space
      - key: AI_SERVICE_URL
        sync: false
      # Shared secret the Space checks; leave unset on both sides to disable.
      - key: AI_SERVICE_TOKEN
        sync: false
